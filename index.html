function add(i){
var pr=products[i];

}
function upd(){
var t=0;var c=0;

}
function order(){
if(cart.length==0){alert('السلة فاضية');return;}
var txt='طلب MIX CHICKEN%0A%0A';

for(var i=0;i<cart.length;i++){txt+=cart[i].n+' x'+cart[i].q+' = '+(cart[i].p*cart[i].q)+' EGP%0A';tot+=cart[i].p*cart[i].q;}
