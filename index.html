  const grid=document.getElementById('grid');
  let html='',lastCat='';
  let cats={sand:'🍔 ساندويتشات - دوس تختار سنجل ودبل',wrap:'🌯 راب',single:'🍗 سنجل',family:'👨‍👩‍👧‍👦 عائلي - 480',extreme:'🔥 اكستريم',kids:'👶 أطفال',add:'➕ إضافات'};
  products.forEach(p=>{
    if(p.cat!==lastCat){
      html+=`<div class="label" data-cat="${p.cat}"><h3>${cats[p.cat]||p.cat}</h3><span>${products.filter(x=>x.cat===p.cat).length} صنف</span></div>`;
      lastCat=p.cat;
    }
    let minPrice=Math.min(...p.options.map(o=>o.price));
    let maxPrice=Math.max(...p.options.map(o=>o.price));
    let priceText=minPrice===maxPrice?`${minPrice} EGP`:`${minPrice} / ${maxPrice} EGP`;
    html+=`<div class="card" data-cat="${p.cat}" onclick="openProduct(${p.id})"><img class="card-img" src="${p.img}"><div class="card-body"><b>${p.name}</b><small>${p.desc}</small><div class="row"><span class="price"><em>${priceText}</em></span><button class="add" onclick="event.stopPropagation();openProduct(${p.id})">👁️</button></div></div></div>`;
  });
  grid.innerHTML=html;
}

function openProduct(id){
  currentProduct=products.find(p=>p.id===id);
  currentQty=1;
  currentOption=currentProduct.options[0];
  document.getElementById('pImg').src=currentProduct.img;
  document.getElementById('pTitle').innerText=currentProduct.name;
  document.getElementById('pDesc').innerText=currentProduct.desc;
  document.getElementById('pQty').innerText=1;
  let optHtml='';
  currentProduct.options.forEach((opt,idx)=>{
    optHtml+=`<div class="option-item ${idx===0?'active':''}" onclick="selectOption(${idx})"><div style="display:flex;align-items:center;gap:10px"><div class="option-check">${idx===0?'✓':''}</div><div><div class="option-name">${opt.label} ${opt.best?'<span style="background:#ff1a1a;color:#fff;padding:2px 6px;border-radius:6px;font-size:9px">الأكثر طلبا</span>':''}</div><span class="option-note">${opt.note||''}</span></div></div><div class="option-price">${opt.price} EGP</div></div>`;
  });
  document.getElementById('pOptions').innerHTML=`<div class="option-title">📏 اختار الحجم - سنجل ولا دبل؟</div><div class="option-group">${optHtml}</div>`;
  updateProductPrice();
  document.getElementById('productModal').classList.add('open');
}
function selectOption(idx){
  currentOption=currentProduct.options[idx];
  document.querySelectorAll('.option-item').forEach((el,i)=>{el.classList.toggle('active',i===idx);el.querySelector('.option-check').innerText=i===idx?'✓':'';});
  updateProductPrice();
}
function pQtyChange(d){currentQty+=d;if(currentQty<1)currentQty=1;if(currentQty>10)currentQty=10;document.getElementById('pQty').innerText=currentQty;updateProductPrice();}
function updateProductPrice(){document.getElementById('pTotalPrice').innerText=(currentOption.price*currentQty)+' EGP';}
function confirmAddToCart(){
  if(!currentProduct||!currentOption)return;
  let fullName=`${currentProduct.name} - ${currentOption.label}`;
  let existing=cart.find(c=>c.fullName===fullName);
  if(existing){
    existing.qty+=currentQty;
  } else {
    cart.push({id:Date.now()+Math.random(),fullName:fullName,baseName:currentProduct.name,option:currentOption.label,price:currentOption.price,qty:currentQty,img:currentProduct.img});
  }
  localStorage.setItem('mixCartFinal',JSON.stringify(cart));
  updateUI();
  closeProduct();
}
function closeProduct(){document.getElementById('productModal').classList.remove('open');}

function updateUI(){
  let totalQty=0,totalPrice=0;
  cart.forEach(i=>{totalQty+=i.qty;totalPrice+=i.price*i.qty;});
  document.getElementById('cartCount').innerText=totalQty;
  document.getElementById('footerCount').innerText=totalQty;
  document.getElementById('footerPrice').innerText=totalPrice+' EGP';
  document.getElementById('totalItems').innerText=totalQty+' قطعة';
  document.getElementById('totalTypes').innerText=cart.length+' نوع';
  document.getElementById('subtotal').innerText=totalPrice+' EGP';
  document.getElementById('totalPrice').innerText=(totalPrice+(totalQty>0?30:0))+' EGP';
  let body=document.getElementById('cartBody');
  if(cart.length===0){
    body.innerHTML='<div style="text-align:center;padding:30px;color:#ffffff55">🛒 سلتك فاضية<br><span style="font-size:11px">نفس المنتج يتجمع - منتج مختلف سطر جديد تحته</span></div>';
  } else {
    let h='';
    cart.forEach((it,idx)=>{
      h+=`<div class="item"><img src="${it.img}"><div style="flex:1"><b style="font-size:13px;color:#fff">${it.baseName}</b><br><span style="font-size:11px;color:#ffcc00;font-weight:800">${it.option}</span><br><span style="font-size:10px;color:#ffffff66">${it.price} EGP × ${it.qty} = ${it.price*it.qty} EGP</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="display:flex;gap:4px;align-items:center;background:#0a0a0a;border:1px solid #ffffff14;border-radius:20px;padding:3px 8px"><button onclick="changeQty(${idx},-1)" style="width:24px;height:24px;border-radius:50%;border:none;background:#ffffff14;color:#fff">−</button><span style="color:#fff;font-weight:900;font-size:13px;min-width:20px;text-align:center">${it.qty}</span><button onclick="changeQty(${idx},1)" style="width:24px;height:24px;border-radius:50%;border:none;background:#fff;color:#000">+</button></div><div style="color:#ffcc00;font-weight:900;font-size:12px">${it.price*it.qty} EGP</div><button onclick="removeItem(${idx})" style="background:#ff1a1a22;color:#ff1a1a;border:none;padding:3px 10px;border-radius:10px;font-size:10px">حذف</button></div></div>`;
    });
    body.innerHTML=h;
  }
}
function changeQty(idx,d){if(cart[idx]){cart[idx].qty+=d;if(cart[idx].qty<=0)cart.splice(idx,1);localStorage.setItem('mixCartFinal',JSON.stringify(cart));updateUI();}}
function removeItem(idx){cart.splice(idx,1);localStorage.setItem('mixCartFinal',JSON.stringify(cart));updateUI();}
function openCart(){document.getElementById('cartModal').classList.add('open');updateUI();}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function sendWhatsApp(){
  if(cart.length===0){alert('سلتك فاضية');return;}
  let name=document.getElementById('custName').value.trim();
  let phone=document.getElementById('custPhone').value.trim();
  let phone2=document.getElementById('custPhone2').value.trim();
  let address=document.getElementById('custAddress').value.trim();
  let notes=document.getElementById('custNotes').value.trim();
  if(!name||!phone||!address||phone.length<11||address.length<10){alert('اكمل الاسم والموبايل والعنوان');return;}
  let totalQty=cart.reduce((s,i)=>s+i.qty,0);
  let totalPrice=cart.reduce((s,i)=>s+i.price*i.qty,0);
  let msg=`🔥 *طلب جديد - MIX CHICKEN* 🔥\n📞 16786\n━━━━━━━━━━━━━━\n\n👤 ${name}\n📱 1: ${phone}\n${phone2?`📱 2: ${phone2}\n`:''}📍 ${address}\n${notes?`📝 ${notes}\n`:''}\n━━━━━━━━━━━━━━\n🍗 *الطلب (${cart.length} أصناف مختلفة - ${totalQty} قطعة):*\n`;
  cart.forEach((it,i)=>{msg+=`${i+1}. ${it.baseName} - ${it.option} × ${it.qty} = ${it.price*it.qty} EGP\n`;});
  msg+=`\n━━━━━━━━━━━━━━\n📦 أنواع: ${cart.length}\n🔢 قطع: ${totalQty}\n💰 أكل: ${totalPrice} EGP\n🛵 توصيل: 30 EGP\n💵 *إجمالي: ${totalPrice+30} EGP*\n\n⏰ ${new Date().toLocaleString('ar-EG')}`;
  window.open('https://wa.me/201015861991?text='+encodeURIComponent(msg),'_blank');
}
document.querySelectorAll('.cat').forEach(cat=>{
  cat.addEventListener('click',()=>{
    document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
    cat.classList.add('active');
    let f=cat.dataset.filter;
    document.querySelectorAll('.card,.label').forEach(card=>{
      if(f==='all')card.classList.remove('hidden');
      else{
        let cd=card.dataset.cat||'';
        if(cd.includes(f))card.classList.remove('hidden');
        else card.classList.add('hidden');
      }
    });
  });
});
renderGrid();
updateUI();
</script>
</body>
</html>
